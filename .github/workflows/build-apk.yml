name: build-apk-local

on:
  push:
    paths:
      - 'mika_tmp/build.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "ndk;27.2.12479018"
          test -d "$SDK_ROOT/platforms/android-37"
          test -d "$SDK_ROOT/ndk/27.2.12479018"

      - name: Restore signing key from history
        run: |
          set -euo pipefail
          mkdir -p .key
          git show a9d69bc5678f67cf450504c44f70c408311181b7:.key/app-release.jks > .key/app-release.jks
          ls -l .key/app-release.jks

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List output
        if: always()
        run: ls -lR app/build/outputs/apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YunBox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
