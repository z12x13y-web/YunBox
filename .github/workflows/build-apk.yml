name: build-apk-local

on:
  push:
    paths:
      - 'mika_tmp/build.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK and NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          ALL="$("$SDKMANAGER" --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -V | tail -n1 || true)"
          NDK="$(echo "$ALL" | grep -oE 'ndk;27\.2\.12479018' | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "PLATFORM=$PLATFORM NDK=$NDK BUILD_TOOLS=$BUILD_TOOLS"
          [ -n "$PLATFORM" ] || { echo "::error::android-37 platform not available"; exit 1; }
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          ARGS=("$PLATFORM")
          [ -n "$NDK" ] && ARGS+=("$NDK")
          [ -n "$BUILD_TOOLS" ] && ARGS+=("$BUILD_TOOLS")
          "$SDKMANAGER" "${ARGS[@]}"
          ls "$SDK_ROOT/platforms"

      - name: Restore signing key from history
        run: |
          set -euo pipefail
          mkdir -p .key
          git show a9d69bc5678f67cf450504c44f70c408311181b7:.key/app-release.jks > .key/app-release.jks
          ls -l .key/app-release.jks

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List output
        if: always()
        run: ls -lR app/build/outputs/apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YunBox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
