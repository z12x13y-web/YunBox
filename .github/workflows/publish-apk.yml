name: publish-apk
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: fetch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45545487193 --repo "$GITHUB_REPOSITORY" -n YunBox-release-apk -D out
          find out -type f
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-45545487193
          name: YunBox apk 45545487193
          body: release apk from run 45545487193 (commit ae96319e7)
          files: out/**/*.apk
